name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Install scripts are skipped; the Prisma client is generated explicitly.
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
        working-directory: server
      - run: npm run typecheck
      - run: npm test
