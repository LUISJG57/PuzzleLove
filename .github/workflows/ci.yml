name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Install scripts are skipped; the Prisma client is generated explicitly.
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
        working-directory: server
      - run: npm run typecheck
      - run: npm test

  ansible:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/ansible
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install ansible==14.4.0 ansible-lint==26.8.0
      - run: ansible-lint --offline site.yml
