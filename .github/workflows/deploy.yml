name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      repo: ${{ steps.refs.outputs.repo }}
      tag: ${{ steps.refs.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Image references
        id: refs
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="sha-${GITHUB_SHA::7}"
          {
            echo "repo=ghcr.io/$owner/"
            echo "tag=$tag"
            echo "app=ghcr.io/$owner/puzzlelove:$tag"
            echo "migrate=ghcr.io/$owner/puzzlelove-migrate:$tag"
            echo "app_latest=ghcr.io/$owner/puzzlelove:latest"
            echo "migrate_latest=ghcr.io/$owner/puzzlelove-migrate:latest"
            echo "backup=ghcr.io/$owner/puzzlelove-backup:$tag"
            echo "backup_latest=ghcr.io/$owner/puzzlelove-backup:latest"
            echo "pipeline=ghcr.io/$owner/puzzlelove-pipeline:$tag"
            echo "pipeline_latest=ghcr.io/$owner/puzzlelove-pipeline:latest"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ steps.refs.outputs.app }}
            ${{ steps.refs.outputs.app_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          push: true
          tags: |
            ${{ steps.refs.outputs.migrate }}
            ${{ steps.refs.outputs.migrate_latest }}
          cache-from: type=gha

      - name: Build and push backup image
        uses: docker/build-push-action@v7
        with:
          context: deploy/backup
          push: true
          tags: |
            ${{ steps.refs.outputs.backup }}
            ${{ steps.refs.outputs.backup_latest }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,scope=backup,mode=max

      - name: Build and push pipeline image
        uses: docker/build-push-action@v7
        with:
          context: analytics
          target: runtime
          push: true
          tags: |
            ${{ steps.refs.outputs.pipeline }}
            ${{ steps.refs.outputs.pipeline_latest }}
          cache-from: type=gha,scope=pipeline

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      - name: Sync deploy files
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          rsync -az --chmod=D755,F644 -e "ssh -i ~/.ssh/id_deploy" \
            --exclude .env --exclude .env.example --exclude traefik/users \
            --exclude docker-compose.local.yml --exclude .deployed-images --exclude ansible \
            deploy/ "$TARGET:/opt/puzzlelove/"

      - name: Deploy release
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          IMAGE_REPO: ${{ needs.images.outputs.repo }}
          IMAGE_TAG: ${{ needs.images.outputs.tag }}
        run: ssh -i ~/.ssh/id_deploy "$TARGET" "IMAGE_REPO='$IMAGE_REPO' bash /opt/puzzlelove/deploy.sh '$IMAGE_TAG'"
