---
# Provisions the server: hardened SSH, firewall, fail2ban, swap, Docker, the resource tiers shared by
# every app on the host, and the app directories.
# Safe to re-run: every task is idempotent. See docs/runbook.md ("Aprovisionar con Ansible").
- name: Provision PuzzleLove server
  hosts: vps
  become: true
  roles:
    - base
    - users
    - ssh
    - firewall
    - fail2ban
    - swap
    - docker
    - app
    - resources
