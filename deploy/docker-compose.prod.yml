# PuzzleLove production stack: Traefik + app + Postgres + Garage (S3) + backups to R2 + Uptime Kuma + analytics pipeline + Superset.
#
# On the VPS (from this directory):
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
# Locally (Docker Desktop, self-signed TLS on puzzlelove.localhost):
#   docker compose -f docker-compose.prod.yml -f docker-compose.local.yml --env-file .env up -d --build
#
# Only Traefik publishes ports (80/443). Docker bypasses UFW, so nothing else may use `ports:`.
name: puzzlelove

services:
  # Read-only, filtered access to the Docker API so Traefik never mounts docker.sock itself.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cgroup_parent: platform.slice
    mem_reservation: 32m
    cpu_shares: 256
    oom_score_adj: -800
    networks: [socket]
    deploy:
      resources:
        limits: { memory: 64M }

  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    depends_on: [socket-proxy]
    command:
      - --global.sendAnonymousUsage=false
      - --api.dashboard=true
      - --ping=true
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.format=json
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=edge
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=le
      - --entrypoints.websecure.http.middlewares=secure-headers@file
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL}
      - --certificatesresolvers.le.acme.caserver=${ACME_CA_SERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/users:/etc/traefik/users:ro
      - letsencrypt:/letsencrypt
    cgroup_parent: platform.slice
    mem_reservation: 64m
    cpu_shares: 1024
    oom_score_adj: -800
    networks: [proxy, socket]
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      traefik.enable: 'true'
      traefik.http.routers.dashboard.rule: Host(`traefik.${DOMAIN:?set DOMAIN}`)
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.middlewares: dashboard-auth@file
    deploy:
      resources:
        limits: { memory: 128M }

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: puzzlelove
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: puzzlelove
    volumes:
      - pgdata:/var/lib/postgresql/data
    cgroup_parent: platform.slice
    mem_reservation: 512m
    cpu_shares: 1024
    oom_score_adj: -800
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U puzzlelove -d puzzlelove']
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 128m
    deploy:
      resources:
        limits: { memory: 1G }

  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    # --single-node lays out a one-node cluster; --default-bucket creates the key and bucket from the env vars.
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      GARAGE_DEFAULT_BUCKET: puzzlelove
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    cgroup_parent: platform.slice
    mem_reservation: 128m
    cpu_shares: 512
    oom_score_adj: -500
    networks: [internal]
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 256M }

  migrate:
    image: ${MIGRATE_IMAGE:-puzzlelove-migrate:local}
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://puzzlelove:${POSTGRES_PASSWORD}@postgres:5432/puzzlelove
    depends_on:
      postgres: { condition: service_healthy }
    cgroup_parent: apps.slice
    cpu_shares: 512
    oom_score_adj: -500
    networks: [internal]

  app:
    image: ${APP_IMAGE:-puzzlelove:local}
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      garage: { condition: service_healthy }
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://puzzlelove:${POSTGRES_PASSWORD}@postgres:5432/puzzlelove
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: puzzlelove
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: 'true'
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      TRUST_PROXY: 1
      # Must match `base` in client/vite.config.ts; scopes the admin cookie (see docs/platform.md).
      BASE_PATH: /puzzlelove
    cgroup_parent: apps.slice
    mem_reservation: 300m
    cpu_shares: 1024
    oom_score_adj: -500
    networks: [proxy, internal]
    # The server saves every room on SIGTERM before exiting.
    stop_grace_period: 30s
    labels:
      traefik.enable: 'true'
      # StripPrefix keeps every Express route and the Socket.IO path at the root, so the
      # container healthcheck and the bots (which connect to http://app:3001) need no prefix.
      traefik.http.routers.app.rule: Host(`${DOMAIN}`) && PathPrefix(`/puzzlelove`)
      traefik.http.routers.app.entrypoints: websecure
      traefik.http.routers.app.middlewares: ratelimit@file,app-slash@docker,app-strip@docker
      traefik.http.middlewares.app-strip.stripprefix.prefixes: /puzzlelove
      # Without the trailing slash StripPrefix would leave an empty path, so redirect first.
      traefik.http.middlewares.app-slash.redirectregex.regex: ^(https?://[^/]+)/puzzlelove$$
      traefik.http.middlewares.app-slash.redirectregex.replacement: $${1}/puzzlelove/
      # Room links shared before the move still work.
      traefik.http.routers.app-legacy.rule: >-
        Host(`${DOMAIN}`) && (PathPrefix(`/r/`) || Path(`/new`) || Path(`/admin`))
      traefik.http.routers.app-legacy.entrypoints: websecure
      traefik.http.routers.app-legacy.middlewares: app-legacy@docker
      traefik.http.routers.app-legacy.service: app
      traefik.http.middlewares.app-legacy.redirectregex.regex: ^(https?://[^/]+)/(.*)$$
      traefik.http.middlewares.app-legacy.redirectregex.replacement: $${1}/puzzlelove/$${2}
      traefik.http.services.app.loadbalancer.server.port: 3001
    deploy:
      resources:
        limits: { memory: 400M }

  # Live bots that play the global room ("🤖 …", client_id "bot-…"); BOTS_MAX=0 disables them.
  bots:
    image: ${APP_IMAGE:-puzzlelove:local}
    restart: unless-stopped
    command: ['node', 'tools/simulator/dist/live.js']
    depends_on:
      app: { condition: service_healthy }
    environment:
      SIM_SERVER_URL: http://app:3001
      BOTS_MAX: ${BOTS_MAX:-2}
    healthcheck:
      disable: true
    cgroup_parent: apps.slice
    mem_reservation: 48m
    cpu_shares: 256
    oom_score_adj: 500
    # `internal`, not the shared `edge` network: the bots only need to reach app:3001, and edge is
    # now shared with every other app on the host.
    networks: [internal]
    stop_grace_period: 5s
    deploy:
      resources:
        limits: { memory: 128M }

  # Daily analytics pipeline (04:30 America/Mexico_City): analytics_events -> Delta lake in Garage -> warehouse schema.
  pipeline:
    image: ${PIPELINE_IMAGE:-puzzlelove-pipeline:local}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      garage: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: puzzlelove
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: puzzlelove
      LAKE_PATH: s3a://lake
      LAKE_S3_ENDPOINT: http://garage:3900
      LAKE_ACCESS_KEY_ID: ${LAKE_ACCESS_KEY_ID:-}
      LAKE_SECRET_ACCESS_KEY: ${LAKE_SECRET_ACCESS_KEY:-}
      SPARK_DRIVER_MEMORY: 2g
    cgroup_parent: batch.slice
    mem_reservation: 512m
    cpu_shares: 128
    oom_score_adj: 800
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 3G, cpus: '2.0' }

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    # Cache only: no persistence, bounded memory.
    command: ['redis-server', '--maxmemory', '96mb', '--maxmemory-policy', 'allkeys-lru', '--save', '', '--appendonly', 'no']
    cgroup_parent: platform.slice
    mem_reservation: 64m
    cpu_shares: 256
    oom_score_adj: -500
    networks: [internal]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { memory: 128M }

  # Creates the superset database, the read-only warehouse role, the admin user and the dashboards (idempotent).
  superset-init:
    image: ${SUPERSET_IMAGE:-puzzlelove-superset:local}
    restart: 'no'
    command: ['python', '/app/bootstrap/init.py']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: &superset-env
      PGHOST: postgres
      PGDATABASE: puzzlelove
      PGUSER: puzzlelove
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?set SUPERSET_SECRET_KEY}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:?set SUPERSET_DB_PASSWORD}
      WAREHOUSE_READER_PASSWORD: ${WAREHOUSE_READER_PASSWORD:?set WAREHOUSE_READER_PASSWORD}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?set SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_EMAIL: ${ACME_EMAIL}
      REDIS_URL: redis://redis:6379
    cgroup_parent: platform.slice
    cpu_shares: 256
    oom_score_adj: 0
    networks: [internal]

  # Apache Superset at superset.$DOMAIN: public read-only dashboard, everything else behind the admin login.
  superset:
    image: ${SUPERSET_IMAGE:-puzzlelove-superset:local}
    restart: unless-stopped
    depends_on:
      superset-init: { condition: service_completed_successfully }
    environment:
      <<: *superset-env
      SERVER_WORKER_AMOUNT: 2
      SERVER_THREADS_AMOUNT: 8
    cgroup_parent: platform.slice
    mem_reservation: 512m
    cpu_shares: 512
    oom_score_adj: 0
    networks: [proxy, internal]
    labels:
      traefik.enable: 'true'
      traefik.http.routers.superset.rule: Host(`superset.${DOMAIN}`)
      traefik.http.routers.superset.entrypoints: websecure
      traefik.http.routers.superset.middlewares: ratelimit@file
      traefik.http.services.superset.loadbalancer.server.port: 8088
    deploy:
      resources:
        limits: { memory: 1200M }

  # Daily encrypted backups of Postgres and Garage to Cloudflare R2 (see backup/backup.sh and docs/runbook.md).
  backup:
    image: ${BACKUP_IMAGE:-puzzlelove-backup:local}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      garage: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: puzzlelove
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: puzzlelove
      AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      RETENTION_DAYS: 30
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      RESOURCES_PING_URL: ${RESOURCES_PING_URL:-}
      # MiB of declared container limits each slice may hold. Keep in sync with resource_slices in
      # deploy/ansible/group_vars/vps.yml: apps is its MemoryHigh (apps should never need throttling),
      # batch is its MemoryMax (the pipeline is meant to run at its ceiling), platform has no kernel
      # ceiling so its number is a growth tripwire.
      SLICE_BUDGETS: platform=3600,apps=2500,batch=3072
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${R2_ENDPOINT:-}
      RCLONE_CONFIG_R2_REGION: ${R2_REGION:-auto}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      # The R2 token is scoped to one bucket, so it cannot list or create buckets.
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
      RCLONE_CONFIG_GARAGE_TYPE: s3
      RCLONE_CONFIG_GARAGE_PROVIDER: Other
      RCLONE_CONFIG_GARAGE_ENDPOINT: http://garage:3900
      RCLONE_CONFIG_GARAGE_REGION: garage
      RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE: 'true'
      RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    # internal reaches postgres/garage; egress reaches R2.
    cgroup_parent: platform.slice
    mem_reservation: 64m
    cpu_shares: 256
    oom_score_adj: 0
    networks: [internal, egress, socket]
    deploy:
      resources:
        limits: { memory: 256M }

  # Monitoring and public status page at status.$DOMAIN (monitors and Discord alerts are configured in its UI).
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5-slim-rootless
    restart: unless-stopped
    environment:
      # Skip the first-run database picker; SQLite in the data volume is enough here.
      UPTIME_KUMA_DB_TYPE: sqlite
    volumes:
      - uptime-kuma:/app/data
    # proxy: Traefik and outbound checks/Discord; internal: TCP checks of postgres/garage and backup pings;
    # socket: container status through the read-only socket proxy.
    cgroup_parent: platform.slice
    mem_reservation: 64m
    cpu_shares: 256
    oom_score_adj: 0
    networks: [proxy, internal, socket]
    labels:
      traefik.enable: 'true'
      # Admin UI: basic auth in front of Uptime Kuma's own login.
      traefik.http.routers.status.rule: Host(`status.${DOMAIN}`)
      traefik.http.routers.status.entrypoints: websecure
      traefik.http.routers.status.middlewares: dashboard-auth@file
      # Public status pages and the assets they need.
      traefik.http.routers.status-public.rule: >-
        Host(`status.${DOMAIN}`) && (PathPrefix(`/status/`) || PathPrefix(`/api/status-page/`) ||
        PathPrefix(`/assets/`) || PathPrefix(`/upload/`) || Path(`/icon.svg`) || Path(`/favicon.ico`) ||
        Path(`/manifest.json`))
      traefik.http.routers.status-public.entrypoints: websecure
      traefik.http.routers.status-public.middlewares: ratelimit@file
      traefik.http.services.status.loadbalancer.server.port: 3001
    deploy:
      resources:
        limits: { memory: 256M }

networks:
  # Shared with every other app on the host; created once (see deploy/ansible/roles/resources).
  proxy:
    name: edge
    external: true
  socket:
    internal: true
  internal:
    internal: true
  egress:

volumes:
  letsencrypt:
  pgdata:
  garage-meta:
  garage-data:
  uptime-kuma:
