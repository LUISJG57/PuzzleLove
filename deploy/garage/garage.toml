# Single-node Garage for PuzzleLove images (and later the data lake).
# Secrets come from GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN in the environment.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
